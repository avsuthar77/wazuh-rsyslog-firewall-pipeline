# ===============================
# WatchGuard Firewall syslog -> Wazuh (example config)
# ===============================
module(load="imudp")
global(maxMessageSize="64k")
template(name="WazuhFormatDetailed" type="string" string="%fromhost-ip% %hostname% %syslogtag%%msg%\n")
template(name="WazuhFileFormat" type="string" string="%fromhost-ip% %hostname% (%timereported:::date-rfc3339%) %syslogtag%%msg%\n")
ruleset(name="watchguard_only") {
    if ($rawmsg contains "configd_newconfig"
        or $rawmsg contains "configd_send_notifications"
        or $rawmsg contains "configd_getListOfChanges"
        or $rawmsg contains "SIGNALED"
        or $rawmsg contains "msg_type5"
        or $rawmsg contains "iterating through") then { stop }
    if ($rawmsg contains 'msg_id="0101-0001"') then {
        if ($rawmsg contains " modified Alias " and $rawmsg contains "modified Alias
") then { stop }
        if ($rawmsg contains " added Alias " and $rawmsg contains "added Alias
") then { stop }
        if ($rawmsg contains " deleted Alias " and $rawmsg contains "deleted Alias
") then { stop }
        if ($rawmsg contains " modified Policy  " and $rawmsg contains "modified Policy
") then { stop }
        if ($rawmsg contains " added Policy  " and $rawmsg contains "added Policy
") then { stop }
        if ($rawmsg contains " deleted Policy  " and $rawmsg contains "deleted Policy
") then { stop }
    }
    if ($rawmsg contains 'msg_id="0101-0001"'
        and $rawmsg contains "Management user"
        and ($rawmsg contains " modified " or $rawmsg contains " added " or $rawmsg contains " deleted ")
        and ($rawmsg contains "Policy " or $rawmsg contains "Alias ")) then {
        action(type="omfile" file="/var/log/watchguard/watchguard-firewall.log"
               fileOwner="root" fileGroup="wazuh" fileCreateMode="0640"
               template="WazuhFileFormat")
        stop
    }
    if ($syslogfacility-text == 'local2' and $msg contains '0101-0001') then {
        action(type="omfile" file="/var/log/watchguard/watchguard-firewall.log"
               fileOwner="root" fileGroup="wazuh" fileCreateMode="0640"
               template="WazuhFileFormat")
        stop
    }
    if ($msg contains "Blocked site:") then {
        action(type="omfile" file="/var/log/watchguard/watchguard-firewall.log"
               fileOwner="root" fileGroup="wazuh" fileCreateMode="0640"
               template="WazuhFileFormat")
        stop
    }
    if ($msg contains "sessiond" and $msg contains "logged in") then {
        action(type="omfile" file="/var/log/watchguard/watchguard-firewall.log"
               fileOwner="root" fileGroup="wazuh" fileCreateMode="0640"
               template="WazuhFileFormat")
        stop
    }
    if ($msg contains "WSM User" and $msg contains "log in attempt was rejected") then {
        action(type="omfile" file="/var/log/watchguard/watchguard-firewall.log"
               fileOwner="root" fileGroup="wazuh" fileCreateMode="0640"
               template="WazuhFileFormat")
        stop
    }
    if ($programname == "admd" or $syslogtag contains "admd") then {
        action(type="omfile" file="/var/log/watchguard/watchguard-firewall.log"
               fileOwner="root" fileGroup="wazuh" fileCreateMode="0640"
               template="WazuhFileFormat")
        stop
    }
    if ($msg contains "Authentication of IKEv2 user" and $msg contains "was rejected") then {
        action(type="omfile" file="/var/log/watchguard/watchguard-firewall.log"
               fileOwner="root" fileGroup="wazuh" fileCreateMode="0640"
               template="WazuhFileFormat")
        stop
    }
    if ($rawmsg contains "firewall:"
        and ($rawmsg contains 'msg_id="3000-0148"'
             or $rawmsg contains 'msg_id="3000-0151"')) then {
        action(type="omfile" file="/var/log/watchguard/watchguard-firewall.log"
               fileOwner="root" fileGroup="wazuh" fileCreateMode="0640"
               template="WazuhFileFormat")
        stop
    }
    if ($rawmsg contains "firewall:") then { action(type="omfile" file="/var/log/watchguard/watchguard-firewall.log" fileOwner="root" fileGroup="wazuh" fileCreateMode="0640" template="WazuhFileFormat") stop }
}
input(type="imudp" port="5141" address="0.0.0.0" ruleset="watchguard_only")
